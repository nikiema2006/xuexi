name: Build APK (Dev / Preview / Production)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build Android"
        required: true
        default: "dev-client"
        type: choice
        options:
          - dev-client
          - preview
          - production

permissions:
  contents: write

env:
  EXPO_TOKEN: bwEkhjCdV1gfqhLjuno-0b4nQVDaZ_zS2MEz8GRL
  GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options=-Xmx2048m"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: edu-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: edu-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('edu-app/**/*.gradle*', 'edu-app/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Clean previous builds
        run: |
          rm -rf android/app/build
          rm -rf .expo
          rm -f app.apk

      - name: Build Android APK
        run: |
          export GRADLE_OPTS="$GRADLE_OPTS -Dorg.gradle.daemon=false"
          OUTPUT_PATH="${{ github.workspace }}/edu-app/app.apk"

          if [ "${{ github.event.inputs.build_type }}" = "dev-client" ]; then
            echo "Building Dev Client"
            eas build --platform android --profile development --local --non-interactive --output "$OUTPUT_PATH"
            echo "RELEASE_TAG=dev-latest" >> $GITHUB_ENV
            echo "RELEASE_NAME=Dev Client (latest)" >> $GITHUB_ENV
            echo "BUILD_DESC=Development build avec Expo Dev Client" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.build_type }}" = "preview" ]; then
            echo "Building Preview"
            eas build --platform android --profile preview --local --non-interactive --output "$OUTPUT_PATH"
            echo "RELEASE_TAG=preview-latest" >> $GITHUB_ENV
            echo "RELEASE_NAME=Preview (latest)" >> $GITHUB_ENV
            echo "BUILD_DESC=Preview build - standalone app (non-dev)" >> $GITHUB_ENV
          else
            echo "Building Production"
            eas build --platform android --profile production --local --non-interactive --output "$OUTPUT_PATH"
            echo "RELEASE_TAG=production-latest" >> $GITHUB_ENV
            echo "RELEASE_NAME=Production (latest)" >> $GITHUB_ENV
            echo "BUILD_DESC=Production build - optimized & signed" >> $GITHUB_ENV
          fi

      - name: Verify APK exists
        run: |
          if [ ! -f "./app.apk" ]; then
            echo "APK not found!"
            exit 1
          fi
          ls -lh ./app.apk

      - name: Delete previous release
        run: gh release delete $RELEASE_TAG -y || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "📱 ${{ env.RELEASE_NAME }}"
          body: |
            **${{ env.BUILD_DESC }}**
            Details techniques:
            - Expo SDK 57
            - Reanimated 4
            - New Architecture activee
            - ABI: arm64-v8a
            - Build type: ${{ github.event.inputs.build_type }}
            Preview/Production : desinstaller l'ancienne version avant installation
          files: edu-app/app.apk
          draft: false
          prerelease: ${{ github.event.inputs.build_type != 'production' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build completed
        run: |
          echo "Build termine avec succes"
          echo "Type: ${{ github.event.inputs.build_type }}"
          echo "https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}"
